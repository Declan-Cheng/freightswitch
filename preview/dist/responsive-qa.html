<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreightSwitch — responsive QA harness</title><style>body{margin:0;background:#d9e1e7;color:#182e3d;font:14px system-ui}header{padding:16px 22px;background:#fff;border-bottom:1px solid #aab9c5}h1{font-size:18px;margin:0 0 6px}p{margin:6px 0}button,a{font:inherit;margin:7px 8px 0 0;padding:7px 12px}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #90a2af;box-shadow:0 5px 20px #0002;background:white;width:390px;height:1000px}strong{display:inline-block;margin-left:12px}</style></head><body><header><h1>Responsive QA harness — not the product homepage</h1><p>Same-origin iframe of the actual app. Buttons set its CSS viewport width. This is not mobile device emulation.</p><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="1280">1280 px desktop</button><a href="/">Open product directly</a><strong id="size">390 × 1000 CSS px</strong></header><main><iframe title="FreightSwitch app at chosen CSS viewport" src="/"></iframe></main><script>for(const b of document.querySelectorAll('button[data-width]'))b.addEventListener('click',()=>{const w=Number(b.dataset.width);document.querySelector('iframe').style.width=w+'px';document.getElementById('size').textContent=w+' × 1000 CSS px';});</script></body></html>
